# Local copy of the upstream oci-genai profile for the shutdown demo.
# Only change: binaries names the Python interpreter of the agent image
# (ghcr.io/astral-sh/uv:python3.12-bookworm-slim) instead of curl.
# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0

id: oci-genai-python
display_name: OCI Generative AI (Python agent)
description: OCI Generative AI inference through the OpenAI-compatible endpoint with a compartment-scoped Generative AI API key
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: OCI Generative AI API key (compartment-scoped, sent as a bearer token)
    env_vars: [OCI_GENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  # `*` matches exactly one DNS label, which is the region identifier, for
  # example us-chicago-1, eu-frankfurt-1, or ap-osaka-1.
  - host: "inference.generativeai.*.oci.oraclecloud.com"
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: POST, path: "/openai/v1/**" }
      - allow: { method: GET, path: "/openai/v1/**" }
      - allow: { method: DELETE, path: "/openai/v1/**" }
binaries: [/usr/local/bin/python3.12]
